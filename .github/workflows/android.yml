name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../../Training.apk
      - name: Als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Training (Android-Test)
          body: "Neueste Test-Version (Build ${{ github.run_number }}). Am Handy Training.apk herunterladen und öffnen."
          files: Training.apk
          make_latest: true
