<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0F14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- HAUPTMENÜ -->
<main class="wrap screen" id="home">
  <header>
    <div class="eyebrow" id="today"></div>
    <div class="brand"><img src="logo.png" alt="" width="52" height="52"><h1>Training</h1></div>
  </header>
  <button class="resume" id="resume" hidden></button>
  <button class="rcard" id="openEssen"><span class="nm">Ernährung</span><span class="meta" id="essenMeta"></span><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <section class="sect">
    <h3>Vorkonfiguriert</h3>
    <div class="cards" id="presetList"></div>
  </section>
  <section class="sect">
    <h3>Eigene Routinen</h3>
    <div class="cards" id="customList"></div>
  </section>
  <button class="rcard" id="openMusic"><span class="nm">Musik &amp; Podcast</span><span class="meta" id="musMeta">Spotify</span><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <details class="card setcard">
    <summary class="eyebrow">Einstellungen</summary>
    <div id="gPauses" style="display:flex;flex-direction:column;gap:10px"></div>
    <label class="toggle"><span>Wiederholungen bestätigen<small>„Geschafft“ oder „Andere Zahl“ nach jedem Satz</small></span><input type="checkbox" id="gConfirm"></label>
    <label class="toggle"><span>3 s Vorlauf<small>Nach „Nächste Übung“ erst 3-2-1, dann geht es los</small></span><input type="checkbox" id="gLead"></label>
    <div class="seg" role="group" aria-label="Schattierung">
      <button class="sbtn" data-shade="2">Gegenlicht</button>
      <button class="sbtn" data-shade="1">Comic</button>
      <button class="sbtn" data-shade="0">Flach</button>
    </div>
    <div class="dtrow"><span>Daten übertragen<small>Routinen, Einstellungen, Statistik und Ernährung in eine andere App holen</small></span><div class="dtbtns"><button class="btn" id="dtExport">Kopieren</button><button class="btn" id="dtImport">Einfügen</button></div></div>
    <label class="toggle"><span>Töne</span><input type="checkbox" id="snd"></label>
    <label class="toggle"><span>Vibration</span><input type="checkbox" id="vib"></label>
  </details>
  <button class="rcard" id="openStats"><span class="nm">Statistik</span><span class="meta" id="lastAll"></span><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
</main>

<!-- STATISTIK -->
<main class="wrap screen" id="stats" hidden>
  <div class="topbar">
    <button class="ic" data-back aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><div class="eyebrow" id="stSum"></div><h1>Statistik</h1></div>
  </div>
  <div class="days" role="tablist" aria-label="Ansicht"><button class="dtab" role="tab" data-st="w" aria-selected="true">Workouts</button><button class="dtab" role="tab" data-st="e" aria-selected="false">Übungen</button></div>
  <div class="list" id="stList"></div>
</main>

<!-- ERNÄHRUNG (essen.js) -->
<main class="wrap screen" id="essen" hidden>
  <div class="topbar">
    <button class="ic" data-back aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><div class="eyebrow" id="eDate"></div><h1>Ernährung</h1></div>
    <button class="ic" id="eMore" aria-label="Ziele, Vorlagen, Claude"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>
  <div class="days" id="eDays" role="tablist" aria-label="Tag"></div>
  <div class="card esum" id="eSum"></div>
  <div id="eSlots"></div>
</main>

<!-- ROUTINE: Übersicht vor dem Start -->
<main class="wrap screen" id="routine" hidden>
  <div class="topbar">
    <button class="ic" data-back aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><div class="eyebrow" id="rEyebrow"></div><h1 id="rName"></h1></div>
    <button class="ic" id="rMore" aria-label="Name, Tage, Löschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
  </div>
  <div class="days" id="rDays" role="tablist" aria-label="Tag"></div>
  <div class="small" id="rSum"></div>
  <button class="btn primary big" id="rStart">Starten</button>
  <div class="seg" id="rView" role="group" aria-label="Ansicht"><button class="sbtn" data-v="list" aria-pressed="true">Liste</button><button class="sbtn" data-v="tl" aria-pressed="false">Timeline</button></div>
  <div class="list" id="rList"></div>
  <div id="rTl" hidden></div>
  <button class="btn ghost" id="rAdd">＋ Übung hinzufügen</button>
</main>

<!-- PLAYER -->
<div class="player" id="player" hidden>
  <div class="pwrap fit">
    <div class="ptop">
      <button class="ic" id="close" aria-label="Workout beenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="ptitle"><div class="eyebrow" id="pEyebrow"></div><div class="nm" id="pName"></div></div>
      <button class="ic" id="plan" aria-label="Übersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg></button>
      <button class="ic" id="mute" aria-label="Töne aus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="muteIco"></svg></button>
      <button class="ic" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="pauseIco"></svg></button>
    </div>
    <div class="pmeta">
      <span class="total num" id="total" title="Gesamtzeit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg><span id="totalT">0:00</span></span>
      <!-- Platzhalter Spotify (wird im Spotify-Chat gebaut): Musik | Podcast + Smart -->
      <div class="spot" id="spotBar" hidden aria-hidden="true">
        <div class="spotseg"><button class="spb" data-src="music" aria-pressed="true">Musik</button><button class="spb" data-src="podcast" aria-pressed="false">Podcast</button></div>
        <button class="spb" id="spotSmart" aria-pressed="false">Smart</button>
      </div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <!-- Zwischenseite nach jeder Übung -->
    <section class="hub" id="hub" hidden>
      <div class="hubhead"><img id="hubImg" alt="" width="64" height="64"><div class="hubtx"><div class="eyebrow" id="hubDone"></div><div class="hubnext">Als Nächstes: <b id="hubNext"></b></div><div class="hubval" id="hubVal"></div></div><div class="hubclock num" id="hubClock" title="Pause">0:00</div></div>
      <div class="hublist plbox" id="hubList"></div>
    </section>
    <div class="stagebox" id="stagebox"><div class="stage" id="stage">
      <div class="hud"><span class="chip on" id="sideChip">Seite 1</span><span class="chip" id="repChip"></span></div>
      <div class="hint" id="hint"></div>
    </div></div>
    <div class="readout" id="readout">
      <div class="phase" id="phase"></div>
      <div class="clock num" id="clock">0:00</div>
      <div class="subctrl" id="restCtrl" hidden><button class="btn ghost" id="plus10">+10 s</button><button class="btn ghost" id="pzEdit">Pause ändern</button><button class="btn ghost" id="endEx">Übung beenden</button></div>
      <button class="target" id="target"></button>
    </div>
    <button class="tips" id="tips" aria-expanded="false"><ul class="cue" id="cue"></ul><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg></button>
    <div class="pctrl">
      <button class="ic" id="prev" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn big" id="main"></button>
      <button class="ic" id="next" aria-label="Überspringen"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
</div>

<!-- ABSCHLUSS -->
<div class="player" id="done" hidden>
  <div class="pwrap">
    <div class="big-ok">✓</div>
    <h1 id="doneTitle"></h1>
    <div class="small" id="doneSum"></div>
    <div class="res" id="doneList"></div>
    <button class="btn primary big" id="doneOk">Fertig</button>
  </div>
</div>

<!-- SHEET (Editor, Übersicht im Workout, Katalog, Bestätigen) -->
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="shhead"><div><div class="eyebrow" id="shEyebrow"></div><h2 id="shTitle"></h2></div><button class="ic" id="shClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="shbody" id="shBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="three.min.js"></script>
<script src="figur.js"></script>
<script src="app.js"></script>
<script src="essen.js"></script>
<script src="spotify.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
